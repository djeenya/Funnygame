<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" />

  <!-- Neon Glowing Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="10" opacity="0.8" filter="url(#glow)" />
  
  <!-- Central Badge Backing -->
  <rect x="86" y="116" width="340" height="280" rx="48" fill="#18181b" stroke="url(#indigoGrad)" stroke-width="4" opacity="0.9" />

  <!-- Glowing Sparkle / Star -->
  <path d="M256 135 L263 155 L285 162 L263 169 L256 190 L249 169 L227 162 L249 155 Z" fill="#fbbf24" filter="url(#glow)" />

  <!-- VKV Monogram Letters -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="115" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">ВКВ</text>
  
  <!-- Subtitle -->
  <text x="256" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#a1a1aa" text-anchor="middle" letter-spacing="8">ВІКТОРИНА</text>
</svg>